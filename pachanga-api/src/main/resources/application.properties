spring.application.name=pachanga-api

# --- Perfil ---
# "dev" en tu PC (mete canchas de prueba, ver config/DatosDePrueba).
# En producción se define la variable de entorno PERFIL=prod y no se mete nada.
spring.profiles.active=${PERFIL:dev}

# --- Base de datos ---
# En local usa el PostgreSQL de Docker (docker-compose.yml en la raíz del proyecto).
# En producción (Render + Supabase) estos valores se pasan con variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pachanga}
spring.datasource.username=${DB_USER:pachanga}
spring.datasource.password=${DB_PASSWORD:pachanga_dev}
# Conexiones abiertas a la vez con la base de datos. El plan gratuito de Supabase admite pocas,
# y para el tráfico del TFG con 5 sobra.
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:5}

# --- Servidor ---
# Render dice en qué puerto escuchar con la variable PORT; en tu PC se usa el 8080 de siempre.
server.port=${PORT:8080}

# --- Flyway ---
# Al arrancar, Flyway ejecuta en orden los scripts de src/main/resources/db/migration (V1__..., V2__...)
# que aún no se hayan aplicado, y apunta cuáles lleva en la tabla flyway_schema_history.
spring.flyway.enabled=true

# --- JPA / Hibernate ---
# Las tablas las crea Flyway, no Hibernate. "validate" solo comprueba al arrancar
# que las clases @Entity coinciden con las tablas; si no coinciden, la app no arranca y avisa.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Sesiones (JWT) ---
# Clave secreta con la que el backend firma los tokens. Mínimo 32 caracteres.
# El valor por defecto es SOLO para desarrollo (este repositorio es público):
# en producción se define la variable de entorno JWT_SECRETO con una clave larga y aleatoria.
pachanga.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-pachanga-no-usar-en-produccion}
# Cuántos días dura una sesión antes de tener que volver a iniciar sesión.
pachanga.jwt.dias-validez=30

# --- Fotos ---
# Dónde se guardan: "local" (carpeta del PC, AlmacenFotosLocal) o "supabase" (AlmacenFotosSupabase).
pachanga.fotos.almacen=${FOTOS_ALMACEN:local}
# Carpeta donde se guardan las fotos subidas en local.
pachanga.fotos.carpeta=${FOTOS_CARPETA:fotos-subidas}
# Datos de Supabase Storage (solo se usan con FOTOS_ALMACEN=supabase). La clave secreta
# NUNCA va en el código: se define en Render como variable de entorno SUPABASE_CLAVE_SECRETA.
pachanga.supabase.url=${SUPABASE_URL:}
pachanga.supabase.clave-secreta=${SUPABASE_CLAVE_SECRETA:}
pachanga.supabase.cubo-fotos=${SUPABASE_CUBO_FOTOS:fotos}
# Tamaño máximo de cada foto. La app las reduce antes de subirlas, así que normalmente ocupan menos de 1 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
