# =====================================================================
# Perfil "prod": se usa en Render (variable de entorno PERFIL=prod).
# Spring lee primero application.properties y después este archivo, que pisa lo que repite.
#
# Aquí las variables NO tienen valor por defecto: si falta alguna, la API no arranca
# y lo dice en el log. Así nunca se publica por error con la clave de desarrollo,
# que está a la vista en GitHub.
# =====================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

pachanga.jwt.secreto=${JWT_SECRETO}

# En Render las fotos van a Supabase Storage (el disco del servidor se borra en cada despliegue).
pachanga.fotos.almacen=supabase
pachanga.supabase.url=${SUPABASE_URL}
pachanga.supabase.clave-secreta=${SUPABASE_CLAVE_SECRETA}
